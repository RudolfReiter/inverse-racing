name: Numerical validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python -m pip install --no-deps -e .
      - run: pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: inverse-racing --quick --output artifacts/smoke.json
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python scripts/check_site.py
      - run: node --check docs/app.js && node --check docs/scene.js
      - run: node scripts/check_interactions.mjs
