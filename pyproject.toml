[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-racing"
version = "0.1.0"
description = "A reproducible recreation of inverse optimal control for autonomous race-car trajectory prediction."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rudolf Reiter"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "matplotlib>=3.7,<4"]

[project.scripts]
inverse-racing = "inverse_racing.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
